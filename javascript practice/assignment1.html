<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table style="background-color: rgb(20, 156, 236); align-items: center;width: 100%;height:200%">
    <tr>
        <td>tea:450<br></td>
        <td>coffee:600<br></td>
        <td>sugar:700<br></td>
        <td>pulses:100<br></td>
    </tr>
    </table>
    <script>
        const shop = {
            tea: 450,
            coffee: 600,
            sugar: 700,
            pulses: 100
        }

        let product = prompt("enter your product");
        let quan = parseInt(prompt("enter your quantity")); 
        let total;

        if (shop[product] !== undefined) {
            total = shop[product] * quan;
            document.write("your total amount is: " + total);
        } else {
            document.write("Product not found");
        }
    </script>
</body>
</html>
