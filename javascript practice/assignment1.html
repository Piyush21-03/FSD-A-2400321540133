<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
</head> 
<body> 
    <table style="
        background-color: rgb(20, 156, 236);width: 80%;margin: 30px auto;text-align: center;border-collapse:collapse;border: 2px solid black;font-family: Arial, sans-serif;font-size: 18px;"> 
        <tr style="height: 50px;"> 
            <td style="border: 1px solid black; padding: 12px;">Tea: 450</td> 
            <td style="border: 1px solid black; padding: 12px;">Coffee: 600</td> 
            <td style="border: 1px solid black; padding: 12px;">Sugar: 700</td> 
            <td style="border: 1px solid black; padding: 12px;">Pulses: 100</td> 
        </tr> 
    </table> 
 
    <script> 
        const shop = { 
            tea: 450, 
            coffee: 600, 
            sugar: 700, 
            pulses: 100 
        } 
        let product = prompt("enter your product"); 
        let quan = parseInt(prompt("enter your quantity"));  
        let total; 
 
        if (shop[product] !== undefined) { 
            total = shop[product] * quan; 
            document.write("your total amount is: " + total); 
        } else { 
            document.write("Product not found"); 
        } 
    </script> 
</body> 
</html>
