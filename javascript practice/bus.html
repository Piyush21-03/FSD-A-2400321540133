            <h3>User Information</h3>
        </center>
        <div style="justify-content: center; align-items: center; display: flex; flex-direction: column; gap: 0px;">
            <p>User Name: <input type="text" id="userName" placeholder="Enter your name"></p>
            <p>User Age: <input type="number" id="userAge" placeholder="Enter your age"></p>
            <p>Adhaar Number: <input type="number" id="adhaarNum" placeholder="Enter your Adhaar number"></p>
            <p>Select Your City: 
                <select name="city" id="city">
                    <option value="delhi">Delhi</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="kolkata">Kolkata</option>
                    <option value="chennai">Chennai</option>
                </select>
            </p>
            <p>Select Date: <input type="date" id="bookingDate"></p>
            <h3>Bus Information</h3>
            <p>Select your Bus Type : </p>
            <!-- Grouped radios with name="busType" -->
            <p>AC Bus: 2000 <input type="radio" name="busType" value="ac" checked></p>
            <p>Non-AC Bus: 1500 <input type="radio" name="busType" value="non-ac"></p>
            <p>Select your Seat : 
                <select name="seat" id="seat">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
            <button id="bookBtn" style="padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 15px;">Book Ticket</button>
        </div>
